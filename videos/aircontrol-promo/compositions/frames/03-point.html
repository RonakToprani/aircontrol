  </style>
  <div id="root" data-composition-id="03-point" data-start="0" data-duration="3.1" data-width="1920" data-height="1080">

    <div class="p03-kicker">Point</div>
    <div class="p03-lead">
      <span class="p03-w">an</span> <span class="p03-w">open</span> <span class="p03-w">hand</span> <span class="p03-w">moves</span> <span class="p03-w">the</span> <span class="p03-w">cursor.</span>

      <div class="p03-bar"><span class="p03-d" style="background:#ff5f57"></span><span class="p03-d" style="background:#febc2e"></span><span class="p03-d" style="background:#28c840"></span></div>

    <div class="p03-win p03-winB" style="left:1230px;top:432px;width:530px;height:350px;">
      <div class="p03-bar"><span class="p03-d" style="background:#ff5f57"></span><span class="p03-d" style="background:#febc2e"></span><span class="p03-d" style="background:#28c840"></span></div>
      <div class="p03-title">Gallery</div>
      <div class="p03-line" style="left:32px;top:76px;width:210px;height:96px;border-radius:8px;background:#52607A;"></div>
      <div class="p03-line" style="left:262px;top:76px;width:236px;height:96px;border-radius:8px;background:#52607A;"></div>
      <div class="p03-line" style="left:32px;top:200px;width:340px;"></div>
      <div class="p03-line" style="left:32px;top:232px;width:420px;"></div>
      <div class="p03-line" style="left:32px;top:264px;width:280px;"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const NS = "http://www.w3.org/2000/svg";

    // --- hand constellation (21 landmarks, open palm, 380x460 box) ---
    const W = [200, 420];
    const chains = [
      [[150,390],[110,350],[80,310],[58,275]],
      [[150,300],[138,235],[132,190],[128,150]],
      [[198,290],[196,215],[195,165],[194,120]],
      [[243,295],[250,225],[253,180],[256,140]],
      [[285,310],[300,255],[308,220],[315,188]]
    ];
    const bonesG = document.querySelector("#root #p03-bones");
    const dotsG = document.querySelector("#root #p03-dots");
    const paths = [];
    const addPath = (pts) => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M " + pts.map((q) => q.join(" ")).join(" L "));
      p.setAttribute("class", "p03-bone");
      bonesG.appendChild(p);
      paths.push(p);
    };
    chains.forEach((c) => addPath([W].concat(c)));
    addPath([chains[1][0], chains[2][0], chains[3][0], chains[4][0]]);
    const dots = [];
    const addDot = (pt, tip) => {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", pt[0]); c.setAttribute("cy", pt[1]);
      c.setAttribute("r", tip ? 10.8 : 7.4);
      c.setAttribute("class", "p03-dot" + (tip ? " p03-tip" : ""));
      dotsG.appendChild(c);
      dots.push(c);
    };
    addDot(W, false);
    chains.forEach((c) => c.forEach((pt, i) => addDot(pt, i === 3)));
    paths.forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });

    // Scene 1 (0.0-0.6): hairlines draw, dots pop, kicker fades up
    paths.forEach((p, i) => {
      tl.to(p, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0 + i * 0.05);
    });
    dots.forEach((d, i) => {
      tl.fromTo(d, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1 + i * 0.015);
    });
    tl.fromTo("#root .p03-kicker", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1);

    // desktop arrives with the hand
    tl.fromTo("#root .p03-panel", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
    tl.fromTo("#root .p03-winA", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
    tl.fromTo("#root .p03-winB", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.2);

    // ring: starts over window A (offset from its resting spot over B's title bar)
    const R0 = { x: -382, y: -34 };
    tl.fromTo("#root .p03-ring", { x: R0.x, y: R0.y, opacity: 0, scale: 0.6 }, { x: R0.x, y: R0.y, opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.3);
    // hover A on
    tl.fromTo("#root .p03-ghostA", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.5);

    // Scene 2 (0.6-1.9): hand drifts right, ring mirrors at full amplitude (same label)
    tl.addLabel("sweep", 0.8);
    tl.to("#root .p03-hand", { x: 40, duration: 0.8, ease: "power2.inOut" }, "sweep");
    tl.to("#root .p03-ring", { x: 0, y: 0, duration: 0.8, ease: "power2.inOut" }, "sweep");
    tl.to("#root .p03-ghostA", { opacity: 0, duration: 0.2, ease: "power1.in" }, 1.08);
    tl.fromTo("#root .p03-ghostB", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.38);

    // Scene 3 (1.9-2.6): lead reveals word by word, ring settles, hand returns to rest
    tl.to("#root .p03-hand", { x: 0, duration: 0.55, ease: "power2.inOut" }, 1.95);
    tl.to("#root .p03-ring", { scale: 0.88, duration: 0.12, ease: "power2.out" }, 1.75);
    tl.to("#root .p03-ring", { scale: 1, duration: 0.3, ease: "power3.out" }, 1.87);
    gsap.utils.toArray("#root .p03-w").forEach((w, i) => {
      tl.fromTo(w, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.85 + i * 0.06);
    });

    tl.set({}, {}, 2.6);
    window.__timelines["03-point"] = tl;
  </script>
