  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var R = document.querySelector('[data-composition-id="04-pinch"]') || document.querySelector('#root');
      var $ = function (s) { return R.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };
      var DUR = 3.2;
      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0–0.5): kicker hard-cut word-swap (discrete-text-sequence) ---------- */
      var SEQ = [ { t: 0.0, text: "POINT" }, { t: 0.30, text: "PINCH" } ];
      function textAt(t) { for (var i = SEQ.length - 1; i >= 0; i--) { if (t >= SEQ[i].t) return SEQ[i].text; } return ""; }
      var kickerEl = $(".p04-kicker-text");
      var drv = { t: 0 };
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { kickerEl.textContent = textAt(drv.t); } }, 0);

      /* ---------- hand landmarks: open palm base + pinch targets ---------- */
      var BASE = [
        [200,420],
        [150,390],[110,350],[80,310],[58,275],
        [150,300],[138,235],[132,190],[128,150],
        [198,290],[196,215],[195,165],[194,120],
        [243,295],[250,225],[253,180],[256,140],
        [285,310],[300,255],[308,220],[315,188]
      ];
      var PINCH = {};
      PINCH[2] = [113,342]; PINCH[3] = [86,284]; PINCH[4] = [97,222];
      PINCH[6] = [136,232]; PINCH[7] = [121,197]; PINCH[8] = [104,210];
      var lmEls = $$(".p04-lm"), boneEls = $$(".p04-bone");
      var pos = BASE.map(function (p) { return [p[0], p[1]]; });
      function setPose(p) {
        for (var i = 0; i < BASE.length; i++) {
          var tgt = PINCH[i];
          if (tgt) { pos[i][0] = BASE[i][0] + (tgt[0] - BASE[i][0]) * p; pos[i][1] = BASE[i][1] + (tgt[1] - BASE[i][1]) * p; }
        }
        for (var k = 0; k < lmEls.length; k++) {
          var el = lmEls[k], idx = +el.getAttribute("data-i");
          if (PINCH[idx]) { el.setAttribute("cx", pos[idx][0].toFixed(2)); el.setAttribute("cy", pos[idx][1].toFixed(2)); }
        }
        for (var b = 0; b < boneEls.length; b++) {
          var ln = boneEls[b], a = +ln.getAttribute("data-a"), c = +ln.getAttribute("data-b");
          if (PINCH[a] || PINCH[c]) {
            ln.setAttribute("x1", pos[a][0].toFixed(2)); ln.setAttribute("y1", pos[a][1].toFixed(2));
            ln.setAttribute("x2", pos[c][0].toFixed(2)); ln.setAttribute("y2", pos[c][1].toFixed(2));
          }
        }
      }
      var pose = { p: 0 };
      setPose(0);

      /* ---------- Scene 2 (0.5–0.9): the pinch — tips meet, ring shrinks + brightens, window ghost + lift ---------- */
      var PINCH_T = 0.5;
      tl.to(pose, { p: 1, duration: 0.35, ease: "power3.inOut", onUpdate: function () { setPose(pose.p); } }, PINCH_T);
      tl.to(".p04-tip-thumb, .p04-tip-index", { attr: { r: 12.8, fill: "#9FEFF8" }, duration: 0.3, ease: "power2.out" }, PINCH_T + 0.05);
      // contact flash where the tips meet
      tl.fromTo(".p04-contact", { opacity: 0 }, { opacity: 0.55, duration: 0.12, ease: "power2.out", immediateRender: false }, 0.78);
      tl.to(".p04-contact", { opacity: 0, duration: 0.35, ease: "power2.in" }, 0.9);

      // ring: shrink to 65% and brighten
      var RING_REST = "0 0 24px 0 rgba(51,191,212,0.55),0 0 2px 0 rgba(159,239,248,0)";
      var RING_HOT  = "0 0 38px 0 rgba(51,191,212,0.95),0 0 8px 0 rgba(159,239,248,0.9)";
      tl.to(".p04-ring", { scale: 0.65, borderColor: "#8FEAF5", boxShadow: RING_HOT, duration: 0.25, ease: "power2.out" }, PINCH_T + 0.05);

      // sticky-hover ghost outline on the window under the ring
      tl.to(".p04-ghost", { opacity: 1, duration: 0.15, ease: "power1.out" }, PINCH_T + 0.05);

      // press-release-spring (adapted): linear press, spring release that LIFTS the window (scale 1.025, deeper shadow)
      var PRESS_START = 0.55, PRESS_DUR = 0.12, RELEASE_START = PRESS_START + PRESS_DUR;
      var SH_REST = "0 8px 24px rgba(0,0,0,0.35)";
      var SH_PRESSED = "0 3px 10px rgba(0,0,0,0.45)";
      var SH_LIFTED = "0 26px 60px rgba(0,0,0,0.6)";
      var SH_SETTLE = "0 14px 44px rgba(0,0,0,0.7)";
      tl.to(".p04-win-b", { scale: 0.975, boxShadow: SH_PRESSED, duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      tl.to(".p04-win-b", { scale: 1.025, boxShadow: SH_LIFTED, duration: 0.45, ease: "back.out(1.6)" }, RELEASE_START);
      // subtle burst behind the window on release
      tl.fromTo(".p04-burst", { scale: 1, opacity: 0 }, { scale: 2.4, opacity: 0.18, duration: 0.45, ease: "power2.out", immediateRender: false }, RELEASE_START);
      tl.to(".p04-burst", { opacity: 0, duration: 0.5, ease: "power2.in" }, RELEASE_START + 0.46);

      /* ---------- Scene 3 (0.9–2.2): DRAG along an S-curve, then release ---------- */
      // cubic bezier in delta space: ring (1382,454) -> (1152,562) abs, i.e. delta (-230,+108)
      var P = [[0, 0], [-30, 120], [-200, -10], [-230, 108]];
      function bez(t) {
        var u = 1 - t;
        return [
          u*u*u*P[0][0] + 3*u*u*t*P[1][0] + 3*u*t*t*P[2][0] + t*t*t*P[3][0],
          u*u*u*P[0][1] + 3*u*u*t*P[1][1] + 3*u*t*t*P[2][1] + t*t*t*P[3][1]
        ];
      }
      function bezD(t) {
        var u = 1 - t;
        return [
          3*u*u*(P[1][0]-P[0][0]) + 6*u*t*(P[2][0]-P[1][0]) + 3*t*t*(P[3][0]-P[2][0]),
          3*u*u*(P[1][1]-P[0][1]) + 6*u*t*(P[2][1]-P[1][1]) + 3*t*t*(P[3][1]-P[2][1])
        ];
      }
      var ringEl = $(".p04-ring"), winEl = $(".p04-win-b"), handEl = $(".p04-hand"), streakEl = $(".p04-streak");
      var drag = { p: 0 };
      function setDrag(p) {
        var d = bez(p), v = bezD(p);
        gsap.set(ringEl, { x: d[0], y: d[1] });
        gsap.set(winEl, { x: d[0], y: d[1] });
        gsap.set(handEl, { x: d[0] / 3, y: d[1] / 3 });
        var w = Math.max(0, 1 - Math.abs(p - 0.5) / 0.18);
        var ang = Math.atan2(v[1], v[0]) * 180 / Math.PI;
        gsap.set(streakEl, { x: d[0], y: d[1], rotation: ang, scaleX: 0.4 + 0.9 * w, opacity: w * w * 0.55 });
      }
      var DRAG_START = 0.9, DRAG_DUR = 1.05, DRAG_END = DRAG_START + DRAG_DUR; // 1.95
      tl.to(drag, { p: 1, duration: DRAG_DUR, ease: "power2.inOut", onUpdate: function () { setDrag(drag.p); } }, DRAG_START);
      // brief directional blur only at the fastest point (midpoint of the eased travel)
      tl.fromTo(".p04-win-b", { filter: "blur(0px)" }, { filter: "blur(2.5px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 1.28);
      tl.to(".p04-win-b", { filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, 1.43);

      // RELEASE at DRAG_END: fingertips part, ring back to full, outline fades, shadow deepens then relaxes
      tl.to(pose, { p: 0, duration: 0.3, ease: "power2.out", onUpdate: function () { setPose(pose.p); } }, DRAG_END);
      tl.to(".p04-tip-thumb, .p04-tip-index", { attr: { r: 10.8, fill: "#5FD8EA" }, duration: 0.3, ease: "power2.out" }, DRAG_END);
      tl.to(".p04-ring", { scale: 1, borderColor: "#33BFD4", boxShadow: RING_REST, duration: 0.4, ease: "back.out(1.7)" }, DRAG_END);
      tl.to(".p04-ghost", { opacity: 0, duration: 0.25, ease: "power1.inOut" }, DRAG_END);
      tl.to(".p04-win-b", { scale: 1, boxShadow: SH_SETTLE, duration: 0.18, ease: "power2.in" }, DRAG_END);
      tl.to(".p04-win-b", { boxShadow: SH_REST, duration: 0.5, ease: "power2.out" }, DRAG_END + 0.18);
      // the hand relaxes back to its rest position (handoff_out: x≈22% / y≈50%, open palm)
      tl.fromTo(handEl, { x: P[3][0] / 3, y: P[3][1] / 3 }, { x: 0, y: 0, duration: 0.55, ease: "power2.inOut", immediateRender: false }, DRAG_END);

      /* ---------- Scene 4 (2.2–3.2): lead line, per-word staggered reveal — two cues, one per sentence ---------- */
      var wIn = { y: 14, opacity: 0, filter: "blur(8px)" };
      var wOut = { y: 0, opacity: 1, filter: "blur(0px)", ease: "expo.out" };
      tl.fromTo(".p04-s1 .p04-w", wIn, Object.assign({ duration: 0.42, stagger: 0.07 }, wOut), 2.2);
      tl.fromTo(".p04-s2 .p04-w", wIn, Object.assign({ duration: 0.4, stagger: 0.07 }, wOut), 2.62);

      window.__timelines["04-pinch"] = tl;
    })();
  </script>
