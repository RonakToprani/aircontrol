  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });

      const world = "#s03-world";
      const thrown = "#s03-thrown";
      const notes = "#s03-notes";
      const outline = "#s03-outline";
      const ring = "#s03-ring";
      const burst = "#s03-burst";
      const blurNode = "#s03-streak-blur";
      const blurTargets = ["#s03-thrown", "#s03-inbox"];

      // ---- beat grid (two bars) ----
      const RING_IN = 0.51;   // beat 2
      const PINCH = 1.03;     // beat 3
      const THROW = 2.05;     // bar line
      const LAND = 3.08;      // half-bar: the hit

      // ---- camera + throw geometry (world px at neutral camera) ----
      // Notes rests centred at x=840; it is thrown +2690 to x=3530.
      // The camera whips so the landed window sits 120px right of centre (P=3410).
      const THROW_DX = 2690;
      const CAM_DX = -(3410 - 960); // = -2450, x = -(P-960)*S at S=1
      const PULL_S = 0.94;          // the one pull after the hit
      const CAM_X_PULLED = CAM_DX * PULL_S;

      // three-phase whip, 1.03s total, velocity-continuous across the joins
      const RAMP = 0.10, BURST = 0.16, TAIL = 0.77;
      const P1 = 0.107, P2 = 0.45;
      const whip = (target, prop, total) => {
        tl.to(target, { [prop]: total * P1, duration: RAMP, ease: "power2.in" }, THROW);
        tl.to(target, { [prop]: total * P2, duration: BURST, ease: "none" }, THROW + RAMP);
        tl.to(target, { [prop]: total, duration: TAIL, ease: "power3.out" }, THROW + RAMP + BURST);
      };

      // ---- Scene 1 (0.00-0.51): pushed in, still. Seeded rest states. ----
      tl.fromTo(world, { x: 0, scale: 1 }, { x: 0, scale: 1, duration: 0.01, ease: "none" }, 0);
      tl.fromTo(thrown, { x: 0 }, { x: 0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo(notes, { scale: 1, boxShadow: "0px 30px 80px rgba(0,0,0,0.70)" },
        { scale: 1, boxShadow: "0px 30px 80px rgba(0,0,0,0.70)", duration: 0.01, ease: "none" }, 0);

      // ---- Scene 2 (0.51-1.54): the ring arrives, then pinches ----
      // fast decelerating arc from lower-right onto the title bar: y resolves first (expo), x sweeps in after (power3)
      tl.fromTo(ring, { x: 0, y: 0, scale: 1 }, { x: -720, duration: 0.42, ease: "power3.out" }, RING_IN);
      tl.to(ring, { y: -1007, duration: 0.42, ease: "expo.out" }, RING_IN);

      // PINCH on the beat: ring shrinks to 65% and brightens
      tl.to(ring, { scale: 0.65, duration: 0.14, ease: "expo.out" }, PINCH);
      tl.to(ring, {
        borderColor: "#C8F3F9",
        boxShadow: "0px 0px 42px rgba(51,191,212,0.95),inset 0px 0px 18px rgba(51,191,212,0.55)",
        duration: 0.14, ease: "expo.out",
      }, PINCH);
      // the window gets its teal ghost outline and lifts: quick compress, then settle up (no bounce)
      tl.fromTo(outline, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, PINCH);
      tl.to(notes, { scale: 0.985, duration: 0.07, ease: "power2.in" }, PINCH);
      tl.to(notes, { scale: 1.015, duration: 0.30, ease: "expo.out" }, PINCH + 0.07);
      tl.to(notes, { boxShadow: "0px 42px 96px rgba(0,0,0,0.78)", duration: 0.32, ease: "expo.out" }, PINCH + 0.07);

      // ---- Scene 3 (2.05-3.08): THE THROW ----
      // window + ring rip right while the camera whips after them (same curve, smaller amplitude,
      // so the window leads across the frame and the world streaks underneath)
      whip(thrown, "x", THROW_DX);
      whip(world, "x", CAM_DX);
      // camera lunge: a touch of push through the burst, flat again by the landing
      tl.to(world, { scale: 1.03, duration: RAMP + BURST, ease: "power2.in" }, THROW);
      tl.to(world, { scale: 1, duration: TAIL, ease: "power3.out" }, THROW + RAMP + BURST);

      // horizontal motion-blur streak on the thrown group and the Inbox passing under it:
      // filter attached at the throw, blur 0 -> 18 across the ramp, held through the burst,
      // 18 -> 0 across the fastest part of the tail, then the filter is removed.
      blurTargets.forEach((sel) => tl.set(sel, { filter: "url(#s03-streak)" }, THROW));
      tl.fromTo(blurNode, { attr: { stdDeviation: "0 0" } },
        { attr: { stdDeviation: "18 0" }, duration: RAMP, ease: "none" }, THROW);
      tl.to(blurNode, { attr: { stdDeviation: "0 0" }, duration: 0.30, ease: "power2.out" }, THROW + RAMP + BURST);
      blurTargets.forEach((sel) => tl.set(sel, { filter: "none" }, THROW + RAMP + BURST + 0.30));

      // ---- the LANDING at 3.08 (the white impact frame is a 40ms clip, no tween) ----
      // ring releases to full size, glow back to rest, with a small teal burst
      tl.to(ring, { scale: 1, duration: 0.22, ease: "expo.out" }, LAND);
      tl.to(ring, {
        borderColor: "#33BFD4",
        boxShadow: "0px 0px 22px rgba(51,191,212,0.50),inset 0px 0px 12px rgba(51,191,212,0.22)",
        duration: 0.30, ease: "expo.out",
      }, LAND);
      // (a set at the hit, not a fromTo: a fromTo's from-state would render at authoring time)
      tl.set(burst, { scale: 0.5, opacity: 0.85 }, LAND);
      tl.to(burst, { scale: 2.6, opacity: 0, duration: 0.45, ease: "expo.out" }, LAND);
      // the window hits: compress, then settle; shadow deepens then relaxes; the ghost outline lets go
      tl.to(notes, { scale: 0.99, duration: 0.06, ease: "power2.in" }, LAND);
      tl.to(notes, { scale: 1, duration: 0.45, ease: "expo.out" }, LAND + 0.06);
      tl.to(notes, { boxShadow: "0px 64px 130px rgba(0,0,0,0.92)", duration: 0.07, ease: "power2.out" }, LAND);
      tl.to(notes, { boxShadow: "0px 22px 56px rgba(0,0,0,0.62)", duration: 0.60, ease: "expo.out" }, LAND + 0.07);
      tl.to(outline, { opacity: 0, duration: 0.35, ease: "expo.out" }, LAND);

      // ---- Scene 4 (3.08-4.10): the camera eases back 6% in one pull, then holds still ----
      tl.to(world, { scale: PULL_S, x: CAM_X_PULLED, duration: 0.70, ease: "expo.out" }, LAND);
      // the ring idles: one slow, tiny drift
      tl.to(ring, { y: -1003, duration: 0.80, ease: "sine.inOut" }, LAND + 0.22);

      window.__timelines["03-throw"] = tl;
    })();
  </script>
