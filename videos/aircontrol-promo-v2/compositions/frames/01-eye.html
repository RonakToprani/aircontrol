<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  (function () {
    var ID = "01-eye";
    var root = document.querySelector('[data-composition-id="' + ID + '"]');
    var $ = function (sel) { return root.querySelector(sel); };
    var $$ = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

    // ── the beat grid (music hit at t=0 of this frame) ─────────────────
    var HIT = 0.0;
    var B1 = 0.51;   // palm bones
    var B2 = 1.03;   // four fingers
    var B3 = 1.54;   // thumb + all 21 dots
    var HALF = B3 + (B3 - B2) / 2;   // 1.795 — the half-beat glow pulse in the hold

    var GLOW_REST = 0.55;

    // ── svg-path-draw setup: measured lengths, dash = offset = length ───
    var bones = $$("#f01-eye-palm path, #f01-eye-fingers path, #f01-eye-thumb");
    bones.forEach(function (p) {
      var len = p.getTotalLength() * 1.02;
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len);
      p.dataset.len = String(len);
    });
    var drawFromTo = function (el, at, dur) {
      var len = parseFloat(el.dataset.len);
      tl.fromTo(
        el,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
        at
      );
    };

    var tl = gsap.timeline({ paused: true });

    // ── Scene 1 (0.00–0.51): the ring BLOOMS from zero on the hit ──────
    // spring-pop-entrance, expo settle, no overshoot; glow blooms with it.
    tl.fromTo(
      "#f01-eye-ring",
      { scale: 0, opacity: 0, svgOrigin: "960 540" },
      { scale: 1, opacity: 1, svgOrigin: "960 540", duration: 0.5, ease: "expo.out" },
      HIT
    );
    // the stroke flashes white-teal on the hit, then rests teal
    tl.fromTo(
      "#f01-eye-ring-stroke",
      { stroke: "#eafcfe" },
      { stroke: "#33bfd4", duration: 0.14, ease: "power2.out" },
      HIT
    );
    // the glow is hot on the hit and settles to its resting intensity
    tl.fromTo(
      "#f01-eye-ring-glow",
      { opacity: 1 },
      { opacity: GLOW_REST, duration: 0.5, ease: "expo.out" },
      HIT
    );

    // ── Scene 2 (0.51–1.54): the hand draws on in three strokes ────────
    // beat +0.51 — palm bones: five spokes radiate from the wrist, the knuckle row follows
    $$(".f01-eye-spoke").forEach(function (p) { drawFromTo(p, B1, 0.32); });
    drawFromTo($("#f01-eye-knuckles"), B1 + 0.2, 0.26);

    // beat +1.03 — the four fingers draw root → tip (hairline stagger, lands inside the beat)
    $$(".f01-eye-finger").forEach(function (p, i) { drawFromTo(p, B2 + i * 0.03, 0.36); });

    // beat +1.54 — the thumb, and all 21 dots pop (wrist → tips, a 60ms ripple)
    drawFromTo($("#f01-eye-thumb"), B3, 0.3);
    $$("#f01-eye-dots circle").forEach(function (c) {
      var step = parseInt(c.getAttribute("data-ring"), 10) || 0;
      tl.fromTo(
        c,
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.34, ease: "expo.out" },
        B3 + step * 0.015
      );
    });

    // the glow ticks lightly on each draw beat — the ring reacts to every hit
    [B1, B2, B3].forEach(function (b) {
      tl.fromTo(
        "#f01-eye-ring-glow",
        { opacity: 0.78 },
        { opacity: GLOW_REST, duration: 0.3, ease: "expo.out", immediateRender: false },
        b
      );
    });

    // ── Scene 3 (1.54–2.05): hold; one more glow pulse on the half-beat, then settle ──
    tl.fromTo(
      "#f01-eye-ring-glow",
      { opacity: 0.95 },
      { opacity: GLOW_REST, duration: 0.25, ease: "expo.out", immediateRender: false },
      HALF
    );

    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
