  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // One bar at ~117 BPM: the four hits.
    const BEATS = [0, 0.51, 1.03, 1.54];
    const PINCH = { x: 100, y: 215 };
    const TEAL = "#33BFD4", ORANGE = "#F0A050";

    // Scene 1 — the pinch closes on the cut (0.00–0.20s): both tips travel to meet.

    tl.fromTo("#s06-index-tip", { attr: { cx: 128, cy: 145 } }, { attr: { cx: PINCH.x, cy: PINCH.y }, duration: 0.2, ease: "power3.out" }, BEATS[0]);
    tl.fromTo("#s06-index-bone", { attr: { x2: 128, y2: 145 } }, { attr: { x2: PINCH.x, y2: PINCH.y }, duration: 0.2, ease: "power3.out" }, BEATS[0]);
    // the ring shrinks a touch with the pinch
    tl.fromTo("#s06-ring", { scale: 1 }, { scale: 0.9, duration: 0.2, ease: "power3.out" }, BEATS[0]);

    // 0.30s — listening: the ring turns orange, a warm bloom opens behind it.
    const LISTEN = 0.30;
    tl.to("#s06-ring-main", { attr: { stroke: ORANGE }, duration: 0.12, ease: "power2.out" }, LISTEN);
    tl.to("#s06-glow-teal", { attr: { opacity: 0 }, duration: 0.12, ease: "power2.out" }, LISTEN);
    tl.fromTo("#s06-glow-orange", { attr: { opacity: 0 } }, { attr: { opacity: 0.6 }, duration: 0.3, ease: "power2.out" }, LISTEN);
    tl.fromTo("#s06-bloom", { opacity: 0, scale: 0.72 }, { opacity: 1, scale: 1, duration: 0.42, ease: "expo.out" }, LISTEN);

    // Scene 2 — the words slam in on the hits: scale 1.12 -> 1, 2-frame blur clearing, expo settle.
    const BLUR = 0.07; // ~2 frames
    const slam = (sel, at, from) => {
      // one baseline fromTo per word (opacity + the 2-frame blur clear); the scale settle rides on top
      tl.fromTo(sel, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: BLUR, ease: "power1.out" }, at);
      tl.fromTo(sel, Object.assign({ scale: 1.12 }, from), { scale: 1, x: 0, y: 0, duration: 0.34, ease: "expo.out", immediateRender: false }, at);
    };
    slam("#s06-w1", BEATS[1], { x: 0, y: 0 });
    slam("#s06-w2", BEATS[2], { x: -14, y: 0 });
    slam("#s06-w3", BEATS[3], { x: 0, y: 12 });

    // Scene 3 — "speak." bottom-left on the last hit; the ring eases back to teal at 1.70.
    tl.fromTo("#s06-speak", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, BEATS[3]);
    const BACK = 1.70;

    tl.to("#s06-glow-orange", { attr: { opacity: 0 }, duration: 0.3, ease: "power2.inOut" }, BACK);
